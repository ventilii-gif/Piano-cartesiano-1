<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-900:#12314f; --blue-700:#1d4e89; --blue-500:#3b7dc4; --blue-100:#e7f0fa;
    --ink:#1f2933; --paper:#faf9f6; --line:#dfe3e8;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--paper);color:var(--ink);font-family:var(--sans);padding:24px;text-align:center}
  .code{font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue-500);margin:0 0 10px}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(24px,5vw,34px);color:var(--blue-900);margin:0 0 10px}
  p{color:#4a5764;max-width:44ch;margin:0 auto 22px;line-height:1.6}
  a.home{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:15px;
    background:var(--blue-700);color:#fff;border-radius:10px;padding:11px 20px}
  a.home:focus-visible{outline:3px solid var(--blue-500);outline-offset:3px}
  a.home svg{width:16px;height:16px}
</style>
</head>
<body>
  <main>
    <p class="code">Errore 404</p>
    <h1>Pagina non trovata</h1>
    <p>La pagina che cerchi non esiste o è stata spostata. Torna all'indice dei moduli di geometria analitica.</p>
    <a class="home" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg>
      Torna all'indice
    </a>
  </main>
</body>
</html>
